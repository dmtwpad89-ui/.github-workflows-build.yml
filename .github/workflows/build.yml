          base64 -d app.b64 > app.zip
          mkdir src
          unzip -q app.zip -d src

      - name: Create Android project and add app code
        run: |
          flutter create --project-name pagepilot --org com.pagepilot --platforms android app
          rm -rf app/lib
          cp -r src/lib app/lib
          cp src/pubspec.yaml app/pubspec.yaml
          python3 - <<'EOF_PY'
          p = "app/android/app/src/main/AndroidManifest.xml"
          t = open(p).read()
          names = ["INTERNET", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_SPECIAL_USE", "POST_NOTIFICATIONS", "WAKE_LOCK", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", "RECEIVE_BOOT_COMPLETED"]
          perms = "".join('    <uses-permission android:name="android.permission.%s"/>\n' % n for n in names)
          t = t.replace("<application", perms + "    <application", 1)
          svc = ('        <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n'
                 '            android:foregroundServiceType="specialUse"\n'
                 '            android:exported="false">\n'
                 '            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="scheduled_posting"/>\n'
                 '        </service>\n')
          t = t.replace("</application>", svc + "    </application>", 1)
          t = t.replace('android:label="pagepilot"', 'android:label="PagePilot"')
          open(p, "w").write(t)
          print(t)
          EOF_PY
          if [ -f app/android/build.gradle.kts ]; then
          cat >> app/android/build.gradle.kts <<'EOF_KTS'
          fun fixSdk(p: Project) {
              if (p.name != "app") {
                  p.extensions.findByName("android")?.let {
                      (it as com.android.build.gradle.BaseExtension).compileSdkVersion(36)
                  }
              }
          }
          subprojects {
              if (state.executed) fixSdk(this) else afterEvaluate { fixSdk(this) }
          }
          EOF_KTS
          else
          cat >> app/android/build.gradle <<'EOF_GRV'
          subprojects {
              def fixSdk = { p ->
                  if (p.name != 'app' && p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
              if (project.state.executed) { fixSdk(project) } else { project.afterEvaluate { fixSdk(project) } }
          }
          EOF_GRV
          fi
          tail -15 app/android/build.gradle* | head -40

      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PagePilot-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
