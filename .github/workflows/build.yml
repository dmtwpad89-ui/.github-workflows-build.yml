          base64 -d app.b64 > app.zip
          mkdir project
          unzip -q app.zip -d project
          find project -type f | sort

      - name: Build release APK
        working-directory: project
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp project/app/build/outputs/apk/release/app-release.apk AB-Uploader.apk
          ls -la AB-Uploader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AB-Uploader-apk
          path: AB-Uploader.apk
