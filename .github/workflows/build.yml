      - name: Create Android project and add app code
        run: |
          flutter create --project-name pagepilot --org com.pagepilot --platforms android app
          rm -rf app/lib
          cp -r src/lib app/lib
          cp src/pubspec.yaml app/pubspec.yaml
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="pagepilot"#android:label="PagePilot"#' $M
          cat $M | head -20

      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PagePilot-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
